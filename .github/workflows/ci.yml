name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Workspace tests (host)
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Short fuzz smoke for the parsers. Longer runs belong to nightly, never to a PR gate.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform 37.0
        # Miuix 0.9.x AARs declare minCompileSdk=37; targetSdk stays 35.
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: primex-dt-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
